version: 2

project_name: gfs

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: gfs
    main: ./cmd/gfs
    binary: gfs
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s
      - -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.branch={{.Branch}}
      - -X main.buildDate={{.Date}}

archives:
  - id: gfs-dist
    ids:
      - gfs
    formats: [tar.gz]
    name_template: "gfs_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: LICENSE
        dst: share/doc/gfs/LICENSE
      - src: README.md
        dst: share/doc/gfs/README.md
      - src: contrib/man/man1/gfs.1
        dst: share/man/man1/gfs.1

checksum:
  name_template: checksums.txt

# Cosign keyless signing (GitHub Actions OIDC). Requires id-token: write in release.yml.
signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - --yes
    artifacts: checksum

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^\\.github:"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

sboms:
  - id: gfs-sbom-spdx
    artifacts: source
    documents:
      - "gfs_{{ .Version }}_sbom.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]
  - id: gfs-sbom-cdx
    artifacts: source
    documents:
      - "gfs_{{ .Version }}_sbom.cyclonedx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

dockers_v2:
  - dockerfile: Dockerfile.release
    sbom: true
    ids:
      - gfs
    images:
      - ghcr.io/hrodrig/gfs
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: "gfs"
      org.opencontainers.image.description: "Web/API door for groot .tar.gz archives"
      org.opencontainers.image.source: "https://github.com/hrodrig/groot-share"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

docker_signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    args:
      - sign
      - "${artifact}@${digest}"
      - --yes
